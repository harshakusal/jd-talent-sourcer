services:
  - type: web
    name: jd-talent-sourcer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: STACKEXCHANGE_KEY
        sync: false
      - key: GITLAB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
